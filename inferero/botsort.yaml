# BoT-SORT for fixed CCTV cameras (Ultralytics tracker config). Without the tracker's own appearance model: who is
# who after a long gap is the analysis's own (reid.py, Runtime._reid, identity.py)
tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.3
track_buffer: 15 # replaced per video from TRACK_BUFFER_S (seconds -> this video's frames, Worker._tracker_cfg)
match_thresh: 0.8
fuse_score: True
gmc_method: none # cameras are fixed, no motion compensation needed
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: False
model: auto
